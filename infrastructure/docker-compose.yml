services:
  postgres:
    image: postgres:16-alpine
    container_name: calmeter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calmeter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calmeter}
      POSTGRES_DB: ${POSTGRES_DB:-calmeter_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - calmeter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calmeter} -d ${POSTGRES_DB:-calmeter_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: calmeter-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - calmeter_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  calmeter_pgdata:
    name: calmeter_pgdata
  calmeter_redisdata:
    name: calmeter_redisdata
